{% extends "base.html" %}
{% block title %}Login — BookHub{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Entrar</button>
</form>
{% if form.errors %}
    <p style="color:#b91c1c;">Usuario o contraseña incorrectos.</p>
{% endif %}
{% endblock %}
