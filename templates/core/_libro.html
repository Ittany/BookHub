<article class="book-card"><a href="{% url 'detalle' libro.pk %}" class="cover">{% if libro.portada %}<img src="{{ libro.portada.url }}" alt="Portada de {{ libro.titulo }}" loading="lazy">{% else %}<div class="cover-placeholder"><span class="cover-lines"></span><span>BOOKHUB</span><strong>{{ libro.titulo|truncatechars:35 }}</strong><small>BIBLIOTECA ACADÉMICA</small></div>{% endif %}</a><div class="book-body"><span class="book-category">{{ libro.categoria.nombre }}</span><h3><a href="{% url 'detalle' libro.pk %}">{{ libro.titulo }}</a></h3><p>{{ libro.autor.nombre }}</p><div class="book-bottom"><span class="{% if libro.disponibles %}available{% else %}unavailable{% endif %}">{% if libro.disponibles %}Disponible{% else %}Sin ejemplares{% endif %}</span><a href="{% url 'detalle' libro.pk %}" aria-label="Ver detalles de {{ libro.titulo }}">Ver detalle →</a></div></div></article>
